<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c1222"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <rect x="0" y="0" width="280" height="450" fill="url(#window)"/>
  <rect x="200" y="120" width="320" height="200" rx="6" fill="#0f172a" stroke="#1e3a5f"/>
  <rect x="220" y="140" width="280" height="150" rx="4" fill="url(#glow)"/>
  <rect x="480" y="280" width="200" height="8" rx="2" fill="#1e293b"/>
  <circle cx="360" cy="200" r="40" fill="#3b82f6" opacity="0.12"/>
